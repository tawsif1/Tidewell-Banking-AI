# Retrieval eval: does search_help_center find the right article?
#
# id      stable name, so results can be compared run to run
# q       the question, phrased the way a customer would type it
#         (not in the article's own words, or the eval flatters the search)
# expect  articles that answer it: file names in help_center/ without ".md".
#         Any one of them in the top 5 counts as a hit.
#         [] = the help center doesn't cover it, so nothing should pass MIN_SEARCH_SCORE.

# --- Covered: 43 questions ------------------------------------------------

# account-types
- {id: acct-01, q: "does my savings account come with a debit card", expect: [account-types]}
- {id: acct-02, q: "how much is the monthly fee on a chequing account?", expect: [account-types, fees-and-courtesy-reversals]}
- {id: acct-03, q: "I want to close my savings account, can you do that for me here", expect: [account-types]}
- {id: acct-04, q: "who do I talk to about how much I can put in my TFSA this year", expect: [account-types]}

# contacting-support-and-escalations
- {id: supp-01, q: "what's your phone number and what hours are you open", expect: [contacting-support-and-escalations]}  # the number is in other articles too; this one is the article meant to answer it
- {id: supp-02, q: "can I talk to a real person instead of a bot", expect: [contacting-support-and-escalations]}
- {id: supp-03, q: "if you pass me to someone, how long until they call me?", expect: [contacting-support-and-escalations]}
- {id: supp-04, q: "my details didn't match, will someone still call me back?", expect: [contacting-support-and-escalations]}

# disputing-a-transaction
- {id: disp-01, q: "there's a charge on my account I never made, what do I do", expect: [disputing-a-transaction, lost-or-stolen-cards, fraud-and-scams]}
- {id: disp-02, q: "how many days do I have to dispute something", expect: [disputing-a-transaction, pending-and-posted-transactions, fraud-and-scams]}
- {id: disp-03, q: "can I still dispute a charge from four months ago", expect: [disputing-a-transaction]}
- {id: disp-04, q: "I filed a dispute, when will I hear back?", expect: [disputing-a-transaction]}
- {id: disp-05, q: "can I dispute the overdraft fee you charged me", expect: [disputing-a-transaction]}  # only this article says fees can't be disputed
- {id: disp-06, q: "a refund I was sent looks wrong, can I dispute the deposit", expect: [disputing-a-transaction]}

# fees-and-courtesy-reversals
- {id: fees-01, q: "how much does it cost to send a wire", expect: [fees-and-courtesy-reversals, transfers-and-limits]}
